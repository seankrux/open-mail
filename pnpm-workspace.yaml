# A single-package workspace: this file makes the venue its own pnpm root
# (pnpm never climbs into a parent workspace) and holds pnpm's settings.
packages:
  - "."

# The npm `overrides` upstream ships, in pnpm's form.
overrides:
  # Keep Kumo and the app on the same patched schema implementation.
  "@cloudflare/kumo>zod": "$zod"
  # TipTap: one version across the editor's packages.
  "@tiptap/core": "3.34.0"
  "@tiptap/pm": "3.34.0"
  "@tiptap/extensions": "3.34.0"
  "@tiptap/extension-blockquote": "3.34.0"
  "@tiptap/extension-bold": "3.34.0"
  "@tiptap/extension-bubble-menu": "3.34.0"
  "@tiptap/extension-bullet-list": "3.34.0"
  "@tiptap/extension-code": "3.34.0"
  "@tiptap/extension-code-block": "3.34.0"
  "@tiptap/extension-document": "3.34.0"
  "@tiptap/extension-dropcursor": "3.34.0"
  "@tiptap/extension-floating-menu": "3.34.0"
  "@tiptap/extension-gapcursor": "3.34.0"
  "@tiptap/extension-hard-break": "3.34.0"
  "@tiptap/extension-heading": "3.34.0"
  "@tiptap/extension-horizontal-rule": "3.34.0"
  "@tiptap/extension-italic": "3.34.0"
  "@tiptap/extension-list": "3.34.0"
  "@tiptap/extension-list-item": "3.34.0"
  "@tiptap/extension-list-keymap": "3.34.0"
  "@tiptap/extension-ordered-list": "3.34.0"
  "@tiptap/extension-paragraph": "3.34.0"
  "@tiptap/extension-strike": "3.34.0"
  "@tiptap/extension-text": "3.34.0"

  "zod@^4": "4.6.7"
  "@hono/node-server": "2.1.6"
  "minimatch@>=7 <11": "11.0.1"
  "@modelcontextprotocol/sdk@^1": "1.32.0"
  "undici@^7": "7.30.2"
  "ws@^8": "8.23.0"
  "esbuild@^0.27": "0.28.2"
  "sharp": "0.35.5"
  "@ai-sdk/provider-utils@^4": "4.0.67"

# Install scripts stay off: esbuild and workerd run from their optional
# platform packages, sharp from its prebuilt @img/* packages, and
# core-js-pure's postinstall is a banner.
ignoredBuiltDependencies:
  - core-js-pure
  - esbuild
  - sharp
  - workerd
